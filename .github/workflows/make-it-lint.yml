# CI uses in-tree bin/mil so every pull request tests the current code,
# not a copied snapshot. events.ndjson is a CI artifact (90 days), not
# committed. examples/sample-repo is a fixture; mil ci here uses this
# repository's .make-it-lint/checks, while selftest runs the full suite
# including sample-repo.

name: make-it-lint

on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  make-it-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: selftest
        run: sh tests/selftest.sh

      - name: mil lint and prove
        run: |
          set -eu
          mkdir -p mil-events
          touch mil-events/events.ndjson
          bin/mil lint
          bin/mil prove --all --dry-run --verify-recorded --events mil-events/events.ndjson

      - name: product checks and governance guard
        env:
          MIL_PR_BRANCH: ${{ github.head_ref || github.ref_name }}
          MIL_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          mkdir -p mil-events
          touch mil-events/events.ndjson
          BASE_SHA="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            bin/mil ci --base-ref "$BASE_SHA" --head-ref HEAD --json-summary mil-ci-summary.json --events mil-events/events.ndjson
          else
            bin/mil ci --head-ref HEAD --json-summary mil-ci-summary.json --events mil-events/events.ndjson
          fi

      - name: upload events
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mil-events
          path: mil-events/events.ndjson
          if-no-files-found: ignore
          retention-days: 90

      - name: PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/pr-comment.py mil-ci-summary.json
